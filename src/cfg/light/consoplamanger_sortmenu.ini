[group_0]
item_name_0=Artist
item_value_0=$if2(%artist%,000)
item_name_1=Title
item_value_1=%title%
item_name_2=Album
item_value_2=$if2(%album%,000)
item_name_3=Genre
item_value_3=$if2(%genre%,000)
[group_1]
item_name_0=Path
item_value_0=%path_sort%
item_name_1=Filename
item_value_1=%filename_ext%
item_name_2=Filesize
item_value_2=%filesize%
item_name_3=Duration
item_value_3=%length%
[group_2]
item_name_0=By Artist and Title
item_value_0=$if2(%artist%,000) - %title%
item_name_1=By Artist and Album
item_value_1=$if2(%album artist%,000) - $if2(%album%,000) - $if2(%discnumber%,000) - $if2(%tracknumber%,%title%)
item_name_2=By Album
item_value_2=$if2(%album%,000) - $if2(%tracknumber%,%title%)
item_name_3=By Track quality
item_value_3=%samplerate% - %channels% - %bitrate%
